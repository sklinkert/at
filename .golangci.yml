version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
  settings:
    staticcheck:
      # Start from staticcheck's default set, then drop the opinionated
      # "quickfix" style refactors (tagged switch, De Morgan's law).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
